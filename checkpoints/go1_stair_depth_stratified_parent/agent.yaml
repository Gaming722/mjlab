load_run: 2026-11-11_12-36-03_stair_depth_balanced_v33_remote
load_checkpoint: model_15200.pt
clip_actions: null
upload_model: false
class_name: OnPolicyRunner
actor:
  hidden_dims: !!python/tuple
  - 256
  - 256
  - 128
  activation: elu
  obs_normalization: true
  cnn_cfg:
    output_channels:
    - 16
    - 32
    kernel_size:
    - 5
    - 3
    stride:
    - 2
    - 2
    padding: zeros
    activation: elu
    max_pool: false
    global_pool: none
    spatial_softmax: true
    spatial_softmax_temperature: 1.0
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
